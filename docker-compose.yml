version: "3.9"

services:
  api:
    build: ./backend
    container_name: magparts-api

    ports:
      - "8000:8000"

    env_file:
      - .env.example

    depends_on:
      - db
      - redis

    volumes:
      - ./backend:/app

    restart: unless-stopped

  db:
    image: postgres:17
    container_name: magparts-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: magparts
      POSTGRES_USER: magparts
      POSTGRES_PASSWORD: changeme

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: magparts-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data:
